name: IndexNow

# Submit recently changed sitemap URLs after relevant site updates.
# Keep sitemap <lastmod> dates current when publication pages are edited.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'publications/**'
      - 'sitemap.xml'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Allow GitHub Pages deployment to finish
        run: sleep 45

      - name: Submit recent sitemap URLs to IndexNow
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: 'https://orbolato.github.io/sitemap.xml'
          key: 'c8977f22b2dfe13d34cc29fb24d52e8e593d5574'
          key-location: 'https://orbolato.github.io/c8977f22b2dfe13d34cc29fb24d52e8e593d5574.txt'
          endpoint: 'api.indexnow.org'
          since: '2'
          since-unit: 'day'
          limit: '100'
          timeout: '20000'
          failure-strategy: 'error'
          lastmod-required: 'true'
