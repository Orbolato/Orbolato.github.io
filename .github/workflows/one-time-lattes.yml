name: One-time Lattes identity link
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Lattes identity links
        run: |
          python - <<'PY'
          from pathlib import Path

          lattes = 'https://lattes.cnpq.br/6806906486391046'

          # Homepage
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '"sameAs":["https://orcid.org/0000-0002-8402-5832","https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en","https://github.com/Orbolato","https://www.researchgate.net/profile/Lucas-Carvalho-62"],'
          new = '"sameAs":["https://orcid.org/0000-0002-8402-5832","https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en","https://lattes.cnpq.br/6806906486391046","https://github.com/Orbolato","https://www.researchgate.net/profile/Lucas-Carvalho-62"],'
          if old not in text:
              raise SystemExit('Homepage sameAs fragment not found')
          text = text.replace(old, new, 1)

          old = 'Researcher profiles: <a href="https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en" target="_blank" rel="noopener noreferrer">Google Scholar</a> · <a href="https://orcid.org/0000-0002-8402-5832" target="_blank" rel="me noopener noreferrer">ORCID 0000-0002-8402-5832</a> · <a href="https://www.researchgate.net/profile/Lucas-Carvalho-62" target="_blank" rel="noopener noreferrer">ResearchGate</a> · <a href="https://github.com/Orbolato" target="_blank" rel="noopener noreferrer">GitHub</a>.'
          new = 'Researcher profiles: <a href="https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en" target="_blank" rel="noopener noreferrer">Google Scholar</a> · <a href="https://orcid.org/0000-0002-8402-5832" target="_blank" rel="me noopener noreferrer">ORCID 0000-0002-8402-5832</a> · <a href="https://lattes.cnpq.br/6806906486391046" target="_blank" rel="noopener noreferrer">Lattes CV</a> · <a href="https://www.researchgate.net/profile/Lucas-Carvalho-62" target="_blank" rel="noopener noreferrer">ResearchGate</a> · <a href="https://github.com/Orbolato" target="_blank" rel="noopener noreferrer">GitHub</a>.'
          if old not in text:
              raise SystemExit('Homepage profile links fragment not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Publications hub
          p = Path('publications/index.html')
          text = p.read_text(encoding='utf-8')
          old = '"sameAs":["https://orcid.org/0000-0002-8402-5832","https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en"]'
          new = '"sameAs":["https://orcid.org/0000-0002-8402-5832","https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en","https://lattes.cnpq.br/6806906486391046"]'
          if old not in text:
              raise SystemExit('Publications hub sameAs fragment not found')
          text = text.replace(old, new, 1)

          old = '<p><a href="https://orcid.org/0000-0002-8402-5832">ORCID</a> · <a href="https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en">Google Scholar</a> · <a href="https://orbolato.github.io/">Research homepage</a></p>'
          new = '<p><a href="https://orcid.org/0000-0002-8402-5832">ORCID</a> · <a href="https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en">Google Scholar</a> · <a href="https://lattes.cnpq.br/6806906486391046">Lattes CV</a> · <a href="https://orbolato.github.io/">Research homepage</a></p>'
          if old not in text:
              raise SystemExit('Publications hub visible links fragment not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publications/index.html
          git commit -m "Add Lattes CV to researcher identity links"
          git push
