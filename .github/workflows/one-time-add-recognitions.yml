name: One-time add publication recognitions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recognition notes to DASC and JOAS papers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          dasc_old = '<p><a href="https://www.researchgate.net/publication/414718816_Stochastic_Strategic_Demand-Capacity_Balancing_Using_Model-Free_Reinforcement_Learning" target="_blank" rel="noopener noreferrer">ResearchGate</a> | <a href="https://orbolato.github.io/dasc2026-paper-276/" target="_blank" rel="noopener noreferrer">Project page</a> | <a href="https://orbolato.github.io/dasc2026-paper-276/paper.pdf" target="_blank" rel="noopener noreferrer">Paper</a> | <a href="https://orbolato.github.io/dasc2026-paper-276/poster.pdf" target="_blank" rel="noopener noreferrer">Poster</a></p></article>'
          dasc_new = '<p><a href="https://www.researchgate.net/publication/414718816_Stochastic_Strategic_Demand-Capacity_Balancing_Using_Model-Free_Reinforcement_Learning" target="_blank" rel="noopener noreferrer">ResearchGate</a> | <a href="https://orbolato.github.io/dasc2026-paper-276/" target="_blank" rel="noopener noreferrer">Project page</a> | <a href="https://orbolato.github.io/dasc2026-paper-276/paper.pdf" target="_blank" rel="noopener noreferrer">Paper</a> | <a href="https://orbolato.github.io/dasc2026-paper-276/poster.pdf" target="_blank" rel="noopener noreferrer">Poster</a></p><p class="small"><strong>Recognition:</strong> Selected as a Student Best Paper Award finalist at DASC 2026.</p></article>'

          joas_old = '<p><a href="https://doi.org/10.59490/joas.2025.7963" target="_blank" rel="noopener noreferrer">DOI</a> | <a href="https://www.researchgate.net/publication/390629925_Open_Machine_Learning_Models_for_Actual_Takeoff_Weight_Prediction" target="_blank" rel="noopener noreferrer">ResearchGate</a></p></article>'
          joas_new = '<p><a href="https://doi.org/10.59490/joas.2025.7963" target="_blank" rel="noopener noreferrer">DOI</a> | <a href="https://www.researchgate.net/publication/390629925_Open_Machine_Learning_Models_for_Actual_Takeoff_Weight_Prediction" target="_blank" rel="noopener noreferrer">ResearchGate</a></p><p class="small"><strong>Recognition:</strong> Based on the solution developed by Team Tiny Rainbow (Aeronautics Institute of Technology), 2nd place in the <a href="https://prc-data-challenge.netlify.app/rankings.html" target="_blank" rel="noopener noreferrer">PRC Data Challenge</a>.</p></article>'

          if dasc_old not in text:
              raise SystemExit('Expected DASC entry not found')
          if joas_old not in text:
              raise SystemExit('Expected JOAS entry not found')

          text = text.replace(dasc_old, dasc_new, 1)
          text = text.replace(joas_old, joas_new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add publication recognition notes"
          git push
