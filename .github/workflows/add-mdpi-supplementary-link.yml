name: Add MDPI supplementary link
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-mdpi-supplementary-link.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add supplementary material link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<p><a href="https://doi.org/10.3390/sci8070169" target="_blank" rel="noopener noreferrer">DOI</a> | <a href="https://www.researchgate.net/publication/409897807_Probabilistic_Modeling_of_Critical_Ground_Times_in_Aeromedical_Organ_Transport_A_Brazilian_Air_Force_Case_Study" target="_blank" rel="noopener noreferrer">ResearchGate</a></p></article>'
          new = '<p><a href="https://doi.org/10.3390/sci8070169" target="_blank" rel="noopener noreferrer">DOI</a> | <a href="https://www.researchgate.net/publication/409897807_Probabilistic_Modeling_of_Critical_Ground_Times_in_Aeromedical_Organ_Transport_A_Brazilian_Air_Force_Case_Study" target="_blank" rel="noopener noreferrer">ResearchGate</a> | <a href="https://www.mdpi.com/article/10.3390/sci8070169/s1" target="_blank" rel="noopener noreferrer">Supplementary material / code</a></p></article>'
          if old not in text:
              raise SystemExit('Expected MDPI paper link block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add MDPI supplementary material link"
          git push
