name: One-time publication links and researcher IDs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link publication pages and researcher identities
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          replacements = {
            '<link rel="canonical" href="https://orbolato.github.io/">': '<link rel="canonical" href="https://orbolato.github.io/">\n<link rel="me" href="https://orcid.org/0000-0002-8402-5832">',
            '"sameAs":["https://github.com/Orbolato","https://www.researchgate.net/profile/Lucas-Carvalho-62"],': '"sameAs":["https://orcid.org/0000-0002-8402-5832","https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en","https://github.com/Orbolato","https://www.researchgate.net/profile/Lucas-Carvalho-62"],',
            '<div class="links"><a href="#publications">Publications</a><a href="https://www.researchgate.net/profile/Lucas-Carvalho-62" target="_blank" rel="noopener noreferrer">ResearchGate</a><a href="https://github.com/Orbolato" target="_blank" rel="noopener noreferrer">GitHub</a></div>': '<div class="links"><a href="#publications">Publications</a><a href="https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en" target="_blank" rel="noopener noreferrer">Google Scholar</a><a href="https://orcid.org/0000-0002-8402-5832" target="_blank" rel="me noopener noreferrer">ORCID</a><a href="https://www.researchgate.net/profile/Lucas-Carvalho-62" target="_blank" rel="noopener noreferrer">ResearchGate</a><a href="https://github.com/Orbolato" target="_blank" rel="noopener noreferrer">GitHub</a></div>',
            '<h3>An optimized model-free reinforcement learning approach for tactical air traffic flow and capacity management under uncertainty</h3>': '<h3><a href="/publications/tactical-atfm-reinforcement-learning/">An optimized model-free reinforcement learning approach for tactical air traffic flow and capacity management under uncertainty</a></h3>',
            '<h3>A stochastic model-free reinforcement learning framework for optimizing runway capacity management under uncertainty</h3>': '<h3><a href="/publications/runway-capacity-reinforcement-learning/">A stochastic model-free reinforcement learning framework for optimizing runway capacity management under uncertainty</a></h3>',
            '<h3>Stochastic Strategic Demand-Capacity Balancing Using Model-Free Reinforcement Learning</h3>': '<h3><a href="/dasc2026-paper-276/">Stochastic Strategic Demand-Capacity Balancing Using Model-Free Reinforcement Learning</a></h3>',
            '<h3>Data-driven framework for urban air mobility planning: Integrating socioeconomic and operational factors for optimal network design in São Paulo, Brazil</h3>': '<h3><a href="/publications/uam-network-planning/">Data-driven framework for urban air mobility planning: Integrating socioeconomic and operational factors for optimal network design in São Paulo, Brazil</a></h3>',
            '<h3>From avoided emissions to potential credits: A simulation-based case study of helicopter-to-eVTOL substitution in São Paulo</h3>': '<h3><a href="/publications/evtol-emissions-carbon-credits/">From avoided emissions to potential credits: A simulation-based case study of helicopter-to-eVTOL substitution in São Paulo</a></h3>',
            '<h3>When Do Data-Driven Models Improve Runway-Configuration Forecasts? Multi-Horizon Operational Evidence from São Paulo/Guarulhos</h3>': '<h3><a href="/publications/runway-configuration-forecasting/">When Do Data-Driven Models Improve Runway-Configuration Forecasts? Multi-Horizon Operational Evidence from São Paulo/Guarulhos</a></h3>',
            '<h3>Predicting Arrival Delays and Flight Time Deviations Under Uncertainty Using Bayesian Neural Networks</h3>': '<h3><a href="/publications/bnn-flight-delay/">Predicting Arrival Delays and Flight Time Deviations Under Uncertainty Using Bayesian Neural Networks</a></h3>',
            '<h3>Open Machine Learning Models for Actual Takeoff Weight Prediction</h3>': '<h3><a href="/publications/actual-takeoff-weight-ml/">Open Machine Learning Models for Actual Takeoff Weight Prediction</a></h3>',
            '<p>For the most current complete publication record, see <a href="https://www.researchgate.net/profile/Lucas-Carvalho-62" target="_blank" rel="noopener noreferrer">ResearchGate</a>. Code and reproducible research resources are available through <a href="https://github.com/Orbolato" target="_blank" rel="noopener noreferrer">GitHub</a>.</p>': '<p>Researcher profiles: <a href="https://scholar.google.com/citations?user=UQdgiPMAAAAJ&hl=en" target="_blank" rel="noopener noreferrer">Google Scholar</a> · <a href="https://orcid.org/0000-0002-8402-5832" target="_blank" rel="me noopener noreferrer">ORCID 0000-0002-8402-5832</a> · <a href="https://www.researchgate.net/profile/Lucas-Carvalho-62" target="_blank" rel="noopener noreferrer">ResearchGate</a> · <a href="https://github.com/Orbolato" target="_blank" rel="noopener noreferrer">GitHub</a>.</p>'
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected homepage fragment not found: {old[:80]}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link scholarly pages and add ORCID and Google Scholar"
          git push
