name: One-time SITRAER link update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken SITRAER record link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'https://conferencias.ufsc.br/index.php/sitraer/xx/paper/view/2181\" target=\"_blank\" rel=\"noopener noreferrer\">Conference record'
          new = 'https://sitraer2023.paginas.ufsc.br/files/2023/12/XXSITRAER-Anais.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Proceedings'
          if old not in text:
              raise SystemExit('Expected SITRAER link not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace SITRAER record with proceedings link"
          git push
