name: One-time meta description fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten homepage meta description
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<meta name="description" content="Research and publications of Lucas Orbolato Carvalho on machine learning, reinforcement learning, air traffic flow and capacity management, runway capacity, urban air mobility, advanced air mobility, aviation analytics, uncertainty, and the SIGMA-Sky project.">'
          new = '<meta name="description" content="Research by Lucas Orbolato Carvalho on reinforcement learning, air traffic management, runway capacity, urban air mobility, and aviation analytics.">'
          if old not in text:
              raise SystemExit('Expected meta description not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shorten homepage meta description"
          git push
