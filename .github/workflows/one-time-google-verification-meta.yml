name: One-time Google verification meta
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Google Search Console verification meta tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<meta name="google-site-verification" content="wrRzEb36Ww9kB-cGQqogdHzTG-XpA0qs-fdTgqaM9co" />'
          if tag in text:
              raise SystemExit('Verification tag already present')
          marker = '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">'
          if marker not in text:
              raise SystemExit('Head marker not found')
          text = text.replace(marker, marker + '\n' + tag, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Google Search Console verification meta tag"
          git push
