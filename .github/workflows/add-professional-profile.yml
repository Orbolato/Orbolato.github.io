# One-time targeted homepage updater
name: Add professional profile details
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-professional-profile.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old_json = '  "image":"https://orbolato.github.io/assets/profile.webp",\n  "affiliation":{"@type":"CollegeOrUniversity","name":"Aeronautics Institute of Technology (ITA)"},\n  "sameAs":'
          new_json = '  "image":"https://orbolato.github.io/assets/profile.webp",\n  "jobTitle":"Captain, Brazilian Air Force (FAB); Civil-Aeronautical Engineer; PhD Candidate and Researcher in Air Transport",\n  "worksFor":{"@type":"Organization","name":"Brazilian Air Force (FAB)"},\n  "affiliation":{"@type":"CollegeOrUniversity","name":"Aeronautics Institute of Technology (ITA)"},\n  "email":"orbolatoloc@fab.mil.br",\n  "sameAs":'
          if old_json not in text:
              raise SystemExit('Expected JSON-LD profile block not found')
          text = text.replace(old_json, new_json, 1)
          old_css = '.hero p{max-width:760px;font-size:1.12rem}\n.kicker{'
          new_css = '.hero p{max-width:760px;font-size:1.12rem}\n.role{font-size:1rem!important;font-weight:700;opacity:.94;margin:0 0 14px;max-width:820px!important}\n.kicker{'
          if old_css not in text:
              raise SystemExit('Expected hero CSS block not found')
          text = text.replace(old_css, new_css, 1)
          old_hero = '      <h1>Lucas Orbolato Carvalho</h1>\n      <p>Research on machine learning, reinforcement learning, and data-driven decision support for air traffic flow and capacity management under uncertainty, with applications to runway operations, demand-capacity balancing, Urban Air Mobility, aviation safety, and probabilistic prediction.</p>'
          new_hero = '      <h1>Lucas Orbolato Carvalho</h1>\n      <p class="role">Captain, Brazilian Air Force (FAB) · Civil-Aeronautical Engineer · PhD Candidate and Researcher in Air Transport at the Aeronautics Institute of Technology (ITA)</p>\n      <p>Research on machine learning, reinforcement learning, and data-driven decision support for air traffic flow and capacity management under uncertainty, with applications to runway operations, demand-capacity balancing, Urban Air Mobility, aviation safety, and probabilistic prediction.</p>'
          if old_hero not in text:
              raise SystemExit('Expected homepage hero block not found')
          text = text.replace(old_hero, new_hero, 1)
          old_links = '<a href="https://github.com/Orbolato" target="_blank" rel="noopener noreferrer">GitHub</a></div>'
          new_links = '<a href="https://github.com/Orbolato" target="_blank" rel="noopener noreferrer">GitHub</a><a href="mailto:orbolatoloc@fab.mil.br">orbolatoloc@fab.mil.br</a></div>'
          if old_links not in text:
              raise SystemExit('Expected hero links block not found')
          text = text.replace(old_links, new_links, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add professional role and FAB contact information"
          git push
